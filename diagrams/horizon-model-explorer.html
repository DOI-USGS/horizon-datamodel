<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Horizon Data Model Explorer</title>
<style>
  :root {
    --bg: #0f1623;
    --panel: #16202e;
    --panel-2: #1d2a3a;
    --border: #2a3a4e;
    --text: #e6edf5;
    --muted: #8aa0b8;
    --accent: #4ea3ff;
    --accent-2: #ffb454;
    --green: #5ad17f;
    --purple: #b78bff;
    --red: #ff7a85;
    --chip-bg: #22344a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #16202e, #121a26);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  .search {
    margin-left: auto;
    position: relative;
  }
  .search input {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    width: 260px;
    outline: none;
    font-size: 13px;
  }
  .search input:focus { border-color: var(--accent); }

  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: calc(100% - 63px);
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; height: auto; }
    nav.side { border-right: none; border-bottom: 1px solid var(--border); }
  }

  nav.side {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 14px 10px;
    background: #121a26;
  }
  nav .group-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    padding: 12px 10px 6px;
  }
  nav button.item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 7px 10px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13.5px;
  }
  nav button.item:hover { background: var(--panel-2); }
  nav button.item.active { background: var(--chip-bg); color: #fff; }
  nav button.item .dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
  }

  main { overflow-y: auto; padding: 24px 28px 60px; }

  .model-card { max-width: 980px; }
  .model-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; row-gap: 8px; margin-bottom: 6px; }
  .model-title h2 { margin: 0; font-size: 24px; }
  .badge {
    font-size: 11px; padding: 2px 9px; border-radius: 20px;
    background: var(--chip-bg); color: var(--muted); border: 1px solid var(--border);
  }
  .badge.inherit { color: var(--purple); border-color: #3a2e55; background: #221a33; }
  .desc { color: var(--muted); margin: 10px 0 22px; max-width: 760px; }

  .inherit-line { margin: 2px 0 20px; font-size: 13px; color: var(--muted); }
  .inherit-line a { color: var(--purple); cursor: pointer; text-decoration: none; }
  .inherit-line a:hover { text-decoration: underline; }

  table { width: 100%; border-collapse: collapse; margin-bottom: 26px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 10px; border-bottom: 1px solid #1c2735; vertical-align: top; }
  tr:hover td { background: #141d29; }
  tr.search-row { cursor: pointer; }
  tr.search-row:hover td { background: #182536; }
  .fname { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text); font-weight: 600; }
  .ftype { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .ftype a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .ftype a:hover { text-decoration: underline; }
  .type-prim { color: var(--green); }
  .type-enum { color: var(--accent-2); }
  .fdesc { color: var(--muted); font-size: 13px; }
  .req { color: var(--red); font-weight: 700; }
  .opt { color: var(--muted); }
  .list-tag { color: var(--purple); }

  .section-h { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 10px 0; }

  .enum-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
  .enum-chip { font-size: 12px; padding: 3px 10px; border-radius: 6px; background: #2a2415; color: var(--accent-2); border: 1px solid #43381d; font-family: ui-monospace, monospace; }

  .rel-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .rel-chip {
    font-size: 12.5px; padding: 5px 12px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--border); cursor: pointer; color: var(--text);
  }
  .rel-chip:hover { border-color: var(--accent); }
  .rel-chip .arrow { color: var(--muted); margin: 0 6px; }

  .overview .cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .ov-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: border-color .15s; }
  .ov-card:hover { border-color: var(--accent); }
  .ov-card h3 { margin: 0 0 6px; font-size: 16px; }
  .ov-card p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .ov-card .meta { margin-top: 10px; font-size: 11.5px; color: var(--muted); }

  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin: 8px 0 26px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dot { width: 9px; height: 9px; border-radius: 50%; }

  .hidden { display: none !important; }
  .hl { background: #3a3410; border-radius: 3px; }
  @keyframes flashrow { 0% { background: #2a3a52; } 100% { background: transparent; } }
  tr.flash td { animation: flashrow 1.6s ease-out; }

  /* Keyboard focus visibility (Section 508 / WCAG 2.4.7) */
  a:focus-visible, button:focus-visible, .rel-chip:focus-visible,
  .ov-card:focus-visible, .enum-chip:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
  }
  @media (prefers-reduced-motion: reduce) {
    tr.flash td { animation: none; }
  }
  footer { color: var(--muted); font-size: 11.5px; margin-top: 30px; border-top: 1px solid var(--border); padding-top: 14px; }
  code.inline { background: var(--panel-2); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Horizon Data Model Explorer</h1>
    <div class="sub">Interactive view of the USGS Horizon metadata schema &middot; generated from the Pydantic models</div>
  </div>
  <div class="search">
    <input id="search" type="text" placeholder="Search fields or models..." autocomplete="off" />
  </div>
</header>

<div class="layout">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>

<script>
/* ------------------------------------------------------------------ *
 * Model data extracted from horizon/*.py (Pydantic v2 models)
 * category: "root" = top-level cataloged entities, "support" = nested
 * ------------------------------------------------------------------ */
const COLORS = { root: "#4ea3ff", support: "#5ad17f", enum: "#ffb454" };

/* Model and enum data below mirrors the Pydantic models in horizon/*.py. */
const ENUMS = {
  UsgsAssetTypeEnum: { values: ["Data", "Model", "Publication", "Software"], desc: "The type of asset cataloged." },
  AccessRightsEnum: { values: ["Public", "Non Public"], desc: "Who can access the resource / its security status." },

  DataciteRelationTypeEnum: { values: ["IsCitedBy", "Cites", "IsSupplementTo", "IsSupplementedBy", "IsContinuedBy", "Continues", "IsNewVersionOf", "IsPreviousVersionOf", "IsPartOf", "HasPart", "IsReferencedBy", "References", "IsDocumentedBy", "Documents", "IsCompiledBy", "Compiles", "IsVariantFormOf", "IsOriginalFormOf", "IsIdenticalTo", "HasMetadata", "IsMetadataFor", "Reviews", "IsReviewedBy", "IsDerivedFrom", "IsSourceOf", "Describes", "IsDescribedBy", "HasVersion", "IsVersionOf", "Requires", "IsRequiredBy", "Obsoletes", "IsObsoletedBy", "IsPublishedIn"], desc: "Relationship between the described and related resource." },
  RelatedIdentifierTypeEnum: { values: ["ARK", "arXiv", "bibcode", "DOI", "EAN13", "EISSN", "Handle", "IGSN", "ISBN", "ISSN", "ISTC", "LISSN", "LSID", "PMID", "PURL", "UPC", "URL", "URN", "w3id"], desc: "The type of related identifier." },

// f(name, type, required, isList, desc, ref=null) -> field object
function f(name, type, required, isList, desc, ref) {
  return { name, type, required: !!required, isList: !!isList, desc, ref: ref || null };

  },

const PRIMITIVES = new Set(["str","int","bool","float","datetime","date","HttpUrl"]);

/* ---------------------- Derived helpers ---------------------- */
function allFields(modelName) {
  // Walk the inheritance chain, base-first, so inherited fields show first.
  const chain = [];
  let cur = modelName;
  while (cur) { chain.unshift(cur); cur = MODELS[cur] ? MODELS[cur].extends : null; }
  const out = [];
  chain.forEach(mn => {
    (MODELS[mn].fields || []).forEach(fl => out.push({ ...fl, from: mn, inherited: mn !== modelName }));
  });
  return out;
}

function childrenOf(modelName) {
  return Object.keys(MODELS).filter(m => MODELS[m].extends === modelName);
}

// models that reference `modelName` via a field
function referencedBy(modelName) {
  const res = [];
  Object.keys(MODELS).forEach(m => {
    allFields(m).forEach(fl => {
      if (fl.ref === modelName && !fl.inherited) res.push({ model: m, field: fl.name, isList: fl.isList });
    });
  });
  return res;
}

/* ---------------------- Rendering ---------------------- */
const nav = document.getElementById("nav");
const main = document.getElementById("main");
let current = "__overview__";

function typeHtml(fl) {
  let inner;
  if (fl.ref && fl.ref.startsWith("enum:")) {
    const en = fl.ref.slice(5);
    inner = `<a role="link" tabindex="0" data-enum="${en}" class="type-enum">${fl.type}</a>`;
  } else if (fl.ref && MODELS[fl.ref]) {
    inner = `<a role="link" tabindex="0" data-model="${fl.ref}">${fl.type}</a>`;
  } else if (PRIMITIVES.has(fl.type)) {
    inner = `<span class="type-prim">${fl.type}</span>`;
  } else {
    inner = `<span>${fl.type}</span>`;
  }
  if (fl.isList) inner = `<span class="list-tag">list[</span>${inner}<span class="list-tag">]</span>`;
  if (!fl.required) inner += ` <span class="opt">| None</span>`;
  return inner;
}

function buildNav() {
  const roots = Object.keys(MODELS).filter(m => MODELS[m].category === "root");
  const support = Object.keys(MODELS).filter(m => MODELS[m].category === "support");
  let html = `<button class="item ${current==='__overview__'?'active':''}" data-model="__overview__">
      <span class="dot" style="background:#fff"></span> Overview</button>`;
  html += `<div class="group-label">Core resources</div>`;
  roots.forEach(m => {
    html += `<button class="item ${current===m?'active':''}" data-model="${m}">
      <span class="dot" style="background:${COLORS.root}"></span> ${m}</button>`;
  });
  html += `<div class="group-label">Supporting objects</div>`;
  support.forEach(m => {
    html += `<button class="item ${current===m?'active':''}" data-model="${m}">
      <span class="dot" style="background:${COLORS.support}"></span> ${m}</button>`;
  });
  html += `<div class="group-label">Enumerations</div>`;
  Object.keys(ENUMS).forEach(e => {
    html += `<button class="item ${current==='__enum__'+e?'active':''}" data-enum="${e}">
      <span class="dot" style="background:${COLORS.enum}"></span> ${e}</button>`;
  });
  nav.innerHTML = html;
}

// Maximal inheritance chains derived from the `extends` graph (single
// inheritance). A chain runs base -> ... -> leaf for every leaf that has a
// parent, so new subclasses appear here automatically.
function inheritanceChains() {
  const names = Object.keys(MODELS);
  const hasChild = new Set(names.map(n => MODELS[n].extends).filter(Boolean));
  const chains = [];
  names.forEach(leaf => {
    if (MODELS[leaf].extends && !hasChild.has(leaf)) {
      const chain = [];
      let cur = leaf;
      while (cur) { chain.unshift(cur); cur = MODELS[cur] ? MODELS[cur].extends : null; }
      chains.push(chain);
    }
  });
  // Longest chains first for a stable, readable order.
  chains.sort((a, b) => b.length - a.length || a[a.length - 1].localeCompare(b[b.length - 1]));
  return chains;
}

function renderOverview() {
  // Cards: core resources first (in declaration order), then supporting objects.
  const roots = Object.keys(MODELS).filter(m => MODELS[m].category === "root");
  const support = Object.keys(MODELS).filter(m => MODELS[m].category === "support");
  const order = [...roots, ...support];
  let cards = order.map(m => {
    const fieldCount = allFields(m).length;
    const inh = MODELS[m].extends ? `extends ${MODELS[m].extends}` : "base model";
    return `<div class="ov-card" role="button" tabindex="0" data-model="${m}">
        <h3>${m}</h3>
        <p>${MODELS[m].desc}</p>
        <div class="meta">${fieldCount} fields &middot; ${inh}</div>
      </div>`;
  }).join("");

  const chainRows = inheritanceChains().map(chain =>
    `<div class="rel-grid">` + chain.map((c, i) =>
      `<span class="rel-chip" role="link" tabindex="0" data-model="${c}">${i ? '<span class="arrow">→</span>' : ''}${c}</span>`
    ).join("") + `</div>`
  ).join("");

  main.innerHTML = `
    <div class="model-card overview">
      <div class="model-title"><h2>Horizon metadata schema</h2></div>
      <p class="desc">The Horizon data model describes cataloged USGS resources and their metadata.
        The core hierarchy is <code class="inline">CatalogedResource → Dataset → DataRelease</code>, with a
        parallel contact hierarchy <code class="inline">Entity → Creator → Contributor</code>.
        Click any model to explore its fields, inheritance, and relationships, or use search above.</p>

      <div class="legend">
        <span><span class="dot" style="background:${COLORS.root}"></span> Core resource</span>
        <span><span class="dot" style="background:${COLORS.support}"></span> Supporting object</span>
        <span><span class="dot" style="background:${COLORS.enum}"></span> Enumeration</span>
        <span><span class="req">*</span> required field</span>
        <span><span class="list-tag">list[ ]</span> collection</span>
      </div>

      <div class="section-h">Inheritance chains</div>
      ${chainRows}

      <div class="section-h" style="margin-top:24px">Models</div>
      <div class="cardgrid">${cards}</div>

      <footer>The model/enum data below mirrors the Pydantic models in
        <code class="inline">horizon/*.py</code>. Each model is a Pydantic class; required fields have no
        default, optional fields default to <code class="inline">None</code>.</footer>
    </div>`;
}

function renderModel(name, focusField) {
  const m = MODELS[name];
  if (!m) return;
  const fields = allFields(name);
  const own = fields.filter(x => !x.inherited);
  const inherited = fields.filter(x => x.inherited);

  const chain = [];
  let cur = m.extends;
  while (cur) { chain.push(cur); cur = MODELS[cur].extends; }

  const kids = childrenOf(name);
  const refs = referencedBy(name);
  const composes = own.filter(x => x.ref && MODELS[x.ref]);

  function fieldRows(list) {
    return list.map(fl => `
      <tr data-field="${fl.name}" id="field-${fl.name}">
        <td class="fname">${fl.name}${fl.required ? ' <span class="req">*</span>' : ''}</td>
        <td class="ftype">${typeHtml(fl)}</td>
        <td class="fdesc">${fl.desc || ''}${fl.inherited ? ` <span class="opt">(from ${fl.from})</span>` : ''}</td>
      </tr>`).join("");
  }

  let html = `<div class="model-card">
    <div class="model-title">
      <h2>${name}</h2>
      <span class="badge">${m.category === 'root' ? 'core resource' : 'supporting object'}</span>
      ${m.extends ? `<span class="badge inherit">extends ${m.extends}</span>` : ''}
    </div>`;

  if (chain.length) {
    html += `<div class="inherit-line">Inherits from ${chain.map(c => `<a role="link" tabindex="0" data-model="${c}">${c}</a>`).join(' ← ')}</div>`;
  }
  html += `<p class="desc">${m.desc}</p>`;

  html += `<div class="section-h">Own fields (${own.length})</div>
    <table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead>
    <tbody>${fieldRows(own) || '<tr><td colspan="3" class="opt">No own fields.</td></tr>'}</tbody></table>`;

  if (inherited.length) {
    html += `<div class="section-h">Inherited fields (${inherited.length})</div>
      <table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead>
      <tbody>${fieldRows(inherited)}</tbody></table>`;
  }

  if (composes.length) {
    html += `<div class="section-h">References these models</div><div class="rel-grid">`;
    composes.forEach(c => {
      html += `<span class="rel-chip" role="link" tabindex="0" data-model="${c.ref}">${c.name}<span class="arrow">→</span>${c.isList ? 'list['+c.ref+']' : c.ref}</span>`;
    });
    html += `</div>`;
  }

  if (refs.length) {
    html += `<div class="section-h">Used by</div><div class="rel-grid">`;
    refs.forEach(r => {
      html += `<span class="rel-chip" role="link" tabindex="0" data-model="${r.model}" data-field="${r.field}">${r.model}<span class="arrow">.</span>${r.field}</span>`;
    });
    html += `</div>`;
  }

  if (kids.length) {
    html += `<div class="section-h">Extended by</div><div class="rel-grid">`;
    kids.forEach(k => { html += `<span class="rel-chip" role="link" tabindex="0" data-model="${k}">${k}</span>`; });
    html += `</div>`;
  }

  html += `</div>`;
  main.innerHTML = html;

  if (focusField) {
    const row = document.getElementById("field-" + focusField);
    if (row) {
      row.scrollIntoView({ block: "center" });
      row.classList.add("flash");
      setTimeout(() => row.classList.remove("flash"), 1600);
    }
  }
}

function renderEnum(name) {
  const e = ENUMS[name];
  if (!e) return;
  const usedBy = [];
  Object.keys(MODELS).forEach(m => {
    (MODELS[m].fields || []).forEach(fl => {
      if (fl.ref === "enum:" + name) usedBy.push({ model: m, field: fl.name });
    });
  });
  main.innerHTML = `<div class="model-card">
    <div class="model-title"><h2>${name}</h2><span class="badge" style="color:${COLORS.enum};border-color:#43381d;background:#2a2415">enumeration</span></div>
    <p class="desc">${e.desc}</p>
    <div class="section-h">Allowed values (${e.values.length})</div>
    <div class="enum-wrap">${e.values.map(v => `<span class="enum-chip">${v}</span>`).join("")}</div>
    ${usedBy.length ? `<div class="section-h">Used by</div><div class="rel-grid">${usedBy.map(u => `<span class="rel-chip" role="link" tabindex="0" data-model="${u.model}" data-field="${u.field}">${u.model}<span class="arrow">.</span>${u.field}</span>`).join("")}</div>` : ""}
  </div>`;
}

/* ---------------------- View routing ---------------------- */
// A view is encoded in the URL hash so pages are linkable and Back/Forward work:
//   #/overview              overview
//   #/model/<Name>          a model (optionally #/model/<Name>/<field>)
//   #/enum/<Name>           an enumeration
//   #/search/<query>        a global search results view
function hashFor(kind, name, extra) {
  if (kind === "overview") return "#/overview";
  if (kind === "model") return "#/model/" + encodeURIComponent(name) + (extra ? "/" + encodeURIComponent(extra) : "");
  if (kind === "enum") return "#/enum/" + encodeURIComponent(name);
  if (kind === "search") return "#/search/" + encodeURIComponent(name);
  return "#/overview";
}

// Navigate by updating the hash; the hashchange handler does the actual render,
// which keeps browser history and in-app navigation in sync.
function go(kind, name, extra) {
  const h = hashFor(kind, name, extra);
  if (location.hash === h) render(); // same hash: re-render (e.g. re-flash a field)
  else location.hash = h;
}

// Back-compat shim for existing callers.
function show(target, isEnum) {
  if (isEnum) go("enum", target);
  else if (target === "__overview__") go("overview");
  else go("model", target);
}

function render() {
  // Split first, decode each segment after, so an encoded "/" inside a query
  // (e.g. a search string) is not mistaken for a path separator.
  const raw = location.hash.replace(/^#\/?/, "");
  const parts = raw.split("/").map(s => { try { return decodeURIComponent(s); } catch { return s; } });
  const kind = parts[0] || "overview";

  if (kind === "model" && parts[1] && MODELS[parts[1]]) {
    renderModel(parts[1], parts[2]);
    current = parts[1];
  } else if (kind === "enum" && parts[1] && ENUMS[parts[1]]) {
    renderEnum(parts[1]);
    current = "__enum__" + parts[1];
  } else if (kind === "search" && parts[1]) {
    renderSearch(parts[1]);
    current = "__search__";
    if (searchBox.value !== parts[1]) searchBox.value = parts[1];
  } else {
    renderOverview();
    current = "__overview__";
  }
  buildNav();
  if (kind !== "model" || !parts[2]) main.scrollTop = 0;
}

/* ---------------------- Interaction ---------------------- */
// A single activation path for both mouse clicks and keyboard (Enter/Space).
function activate(el) {
  if (!el) return;
  if (el.dataset.enum != null) { go("enum", el.dataset.enum); return; }
  if (el.dataset.model != null) { go("model", el.dataset.model, el.dataset.field); return; }
}

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-model],[data-enum]");
  if (!el) return;
  activate(el);
});

// Keyboard operability for the custom controls (chips, cards, type links).
// Native <button> elements already handle Enter/Space themselves.
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter" && ev.key !== " ") return;
  const el = ev.target.closest("[tabindex]");
  if (!el || el.tagName === "BUTTON" || el.tagName === "INPUT") return;
  if (!el.matches("[data-model],[data-enum]")) return;
  ev.preventDefault();
  activate(el);
});

window.addEventListener("hashchange", render);

/* ---------------------- Search ---------------------- */
const searchBox = document.getElementById("search");

// Build a flat index once: every model, enum, field, and enum value, with the
// text that should match and where clicking a result should land.
function buildSearchIndex() {
  const idx = [];
  Object.keys(MODELS).forEach(mn => {
    const m = MODELS[mn];
    idx.push({ kind: "model", label: mn, sub: m.category === "root" ? "core resource" : "supporting object", text: (mn + " " + (m.desc || "")).toLowerCase(), nav: ["model", mn] });
    allFields(mn).filter(fl => !fl.inherited).forEach(fl => {
      idx.push({ kind: "field", label: mn + "." + fl.name, sub: fl.type + (fl.desc ? " — " + fl.desc : ""), text: (fl.name + " " + fl.type + " " + (fl.desc || "")).toLowerCase(), nav: ["model", mn, fl.name] });
    });
  });
  Object.keys(ENUMS).forEach(en => {
    const e = ENUMS[en];
    idx.push({ kind: "enum", label: en, sub: e.desc || "", text: (en + " " + (e.desc || "") + " " + e.values.join(" ")).toLowerCase(), nav: ["enum", en] });
    e.values.forEach(v => {
      idx.push({ kind: "value", label: v, sub: "value of " + en, text: (v + " " + en).toLowerCase(), nav: ["enum", en] });
    });
  });
  return idx;
}
const SEARCH_INDEX = buildSearchIndex();

function renderSearch(q) {
  const ql = q.toLowerCase().trim();
  const hits = ql ? SEARCH_INDEX.filter(e => e.text.includes(ql)) : [];
  const order = { model: 0, field: 1, enum: 2, value: 3 };
  hits.sort((a, b) => (order[a.kind] - order[b.kind]) || a.label.localeCompare(b.label));

  const kindLabel = { model: "Model", field: "Field", enum: "Enum", value: "Enum value" };
  let rows = hits.map(h => `
      <tr data-nav-kind="${h.nav[0]}" data-nav-name="${h.nav[1]}"${h.nav[2] ? ` data-nav-field="${h.nav[2]}"` : ""} class="search-row">
        <td class="fname">${h.label}</td>
        <td class="ftype"><span class="opt">${kindLabel[h.kind]}</span></td>
        <td class="fdesc">${h.sub || ""}</td>
      </tr>`).join("");

  main.innerHTML = `<div class="model-card">
    <div class="model-title"><h2>Search</h2><span class="badge">${hits.length} result${hits.length === 1 ? "" : "s"}</span></div>
    <p class="desc">Matches for <code class="inline">${q}</code> across model names, fields, enumerations, enum values, and descriptions.</p>
    ${hits.length
      ? `<table><thead><tr><th>Match</th><th>Kind</th><th>Detail</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<p class="opt">No matches. Try a model name, field name, or enum value.</p>`}
  </div>`;
}

// Clicking a search result navigates to the right view (and field).
main.addEventListener("click", (ev) => {
  const tr = ev.target.closest(".search-row");
  if (!tr) return;
  go(tr.dataset.navKind, tr.dataset.navName, tr.dataset.navField);
});

let searchTimer = null;
searchBox.addEventListener("input", () => {
  const q = searchBox.value.trim();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    if (q) go("search", q);
    else if (current === "__search__") go("overview");
  }, 150);
});
searchBox.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const q = searchBox.value.trim();
  if (q) go("search", q);
});

/* ---------------------- Boot ---------------------- */
if (!location.hash) render();           // default -> overview
else render();                          // deep link on load
</script>
</body>
</html>
